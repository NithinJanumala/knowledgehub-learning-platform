<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub | Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="gold-theme bg-dark m-0 p-0 fade-in">
    <div class="container-fluid min-vh-100 p-0 m-0">
        <div class="row g-0 min-vh-100">
            <!-- Left Side: Branding -->
            <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center position-relative" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); overflow: hidden;">
                <div class="position-absolute top-0 start-0 w-100 h-100" style="background: radial-gradient(circle at top right, rgba(250, 204, 21, 0.15), transparent 50%);"></div>
                <div class="position-absolute bottom-0 end-0 w-100 h-100" style="background: radial-gradient(circle at bottom left, rgba(250, 204, 21, 0.05), transparent 50%);"></div>
                
                <div class="text-center z-1 px-5" style="transform: translateY(-20px);">
                    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 5rem; filter: drop-shadow(0 0 20px rgba(250,204,21,0.3));"></i>
                    <h1 class="display-4 fw-bold text-light mt-4 mb-3" style="letter-spacing: -1px;">Welcome to KnowledgeHub</h1>
                    <p class="lead text-muted tracking-wide">Learn. Build. Grow.</p>
                    
                    <div class="mt-5 glass-card p-4 mx-auto text-start hover-lift" style="max-width: 400px; transform: rotate(-2deg);">
                        <div class="d-flex align-items-center mb-3 border-bottom border-secondary border-opacity-25 pb-2">
                            <div class="bg-danger rounded-circle" style="width:12px; height:12px;"></div>
                            <div class="bg-warning rounded-circle ms-2" style="width:12px; height:12px;"></div>
                            <div class="bg-success rounded-circle ms-2" style="width:12px; height:12px;"></div>
                        </div>
                        <code class="text-light fs-6" style="font-family: monospace;">
                            <span class="text-primary">const</span> journey = <span class="text-warning">new</span> <span class="text-info">LearningPath</span>();<br>
                            journey.<span class="text-info">start</span>().<span class="text-info">then</span>(() => {<br>
                            &nbsp;&nbsp;<span class="text-primary">return</span> success;<br>
                            });
                        </code>
                    </div>
                </div>
            </div>

            <!-- Right Side: Login Form -->
            <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center bg-dark position-relative">
                <a href="index.html" class="position-absolute top-0 start-0 m-4 text-decoration-none text-muted hover-text-primary transition-all">
                    <i class="bi bi-arrow-left me-2"></i>Back to Home
                </a>
                
                <div class="w-100" style="max-width: 450px; padding: 2rem;">
                    <div class="text-center mb-5 d-lg-none">
                        <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold mt-3 text-light">KnowledgeHub</h2>
                    </div>
                    
                    <h3 class="fw-bold text-light mb-1">Sign In</h3>
                    <p class="text-muted mb-4">Access your learning dashboard</p>
                    
                    <div id="alert-box" class="alert d-none shadow-sm rounded-3"></div>
                    
                    <form id="login-form">
                        <div class="mb-4">
                            <label class="form-label text-muted fw-semibold small text-uppercase tracking-wide">Email Address</label>
                            <div class="input-group input-glow-wrap">
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted border-end-0">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="email" class="form-control bg-dark border-secondary border-opacity-25 text-light border-start-0 ps-0 shadow-none" placeholder="name@example.com" required>
                            </div>
                        </div>
                        
                        <div class="mb-5 position-relative">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label text-muted fw-semibold small text-uppercase tracking-wide mb-0">Password</label>
                                <a href="#" class="text-primary small text-decoration-none transition-all hover-text-light">Forgot password?</a>
                            </div>
                            <div class="input-group input-glow-wrap">
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted border-end-0">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" class="form-control bg-dark border-secondary border-opacity-25 text-light border-start-0 border-end-0 ps-0 shadow-none" placeholder="••••••••" required>
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted border-start-0" style="cursor: pointer;" id="togglePassword">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>
                        
                        <button type="submit" id="loginBtn" class="btn btn-primary-gradient w-100 py-3 fw-bold hover-lift mb-4 d-flex justify-content-center align-items-center rounded-3">
                            <span id="btnText">Sign In</span>
                            <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </form>
                    
                    <p class="text-center text-muted mt-2">
                        Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none transition-all hover-text-light">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        // Form & Button Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            spinner.classList.remove('d-none');
            text.textContent = 'Authenticating...';
            
            // Allow original auth.js to handle login via the form event, 
            // but we need to load auth.js since we replaced the HTML
        });

        // Toggle Password
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
