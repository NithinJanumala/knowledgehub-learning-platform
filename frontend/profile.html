<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub - Profile</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="gold-theme">
    
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i>KnowledgeHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">My Learning</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center gap-2" id="nav-user-section">
                    <!-- Auth injected by api.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Profile Content -->
    <main class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="display-6 fw-bold mb-4 text-light">User Profile</h2>
                
                <div class="glass-card p-5 mb-4 text-center">
                    <div class="mb-4">
                        <div id="profile-avatar" class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle text-dark fw-bold display-4 shadow-lg" style="width: 120px; height: 120px;">
                            U
                        </div>
                    </div>
                    
                    <h3 id="profile-name" class="fw-bold text-light mb-1">User</h3>
                    <p id="profile-email" class="text-muted mb-4">user@example.com</p>
                    
                    <div class="row g-4 text-center mb-4 border-top border-secondary border-opacity-25 pt-4">
                        <div class="col-6">
                            <div class="p-3 glass-card hover-lift h-100">
                                <i class="bi bi-calendar-check text-primary fs-3 mb-2 d-block"></i>
                                <h5 class="fw-bold text-light mb-1" id="profile-joined">Just now</h5>
                                <small class="text-muted text-uppercase tracking-wide">Joined</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 glass-card hover-lift h-100">
                                <i class="bi bi-book text-primary fs-3 mb-2 d-block"></i>
                                <h5 class="fw-bold text-light mb-1" id="profile-enrolled-count">0</h5>
                                <small class="text-muted text-uppercase tracking-wide">Courses Enrolled</small>
                            </div>
                        </div>
                    </div>
                    
                    <a href="settings.html" class="btn btn-primary-gradient px-4 py-2 hover-lift">
                        <i class="bi bi-pencil-square me-2"></i>Edit Profile
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 border-top border-secondary border-opacity-25 mt-auto">
        <p class="mb-0 text-muted">&copy; 2026 KnowledgeHub. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('knowledgehub_user');
            if (!userStr && !localStorage.getItem('userProfile')) {
                window.location.href = 'login.html';
                return;
            }

            // Load from userProfile first, fallback to knowledgehub_user
            let profileData = JSON.parse(localStorage.getItem('userProfile'));
            if (!profileData) {
                const baseUser = JSON.parse(userStr) || { username: 'Learner', email: 'learner@example.com' };
                profileData = {
                    name: baseUser.username || baseUser.name || 'Learner',
                    email: baseUser.email || 'learner@example.com',
                    joined: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
                };
                localStorage.setItem('userProfile', JSON.stringify(profileData));
            }

            document.getElementById('profile-name').textContent = profileData.name;
            document.getElementById('profile-email').textContent = profileData.email;
            document.getElementById('profile-joined').textContent = profileData.joined || 'Just now';
            
            // Generate initials
            const initials = profileData.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('profile-avatar').textContent = initials;

            const enrolled = JSON.parse(localStorage.getItem('enrolledCourses') || '[]');
            document.getElementById('profile-enrolled-count').textContent = enrolled.length;
        });
    </script>
</body>
</html>
