<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub - Settings</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="gold-theme">
    
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i>KnowledgeHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">My Learning</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center gap-2" id="nav-user-section">
                    <!-- Auth injected by api.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Settings Content -->
    <main class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="display-6 fw-bold text-light mb-0">Settings</h2>
                    <a href="profile.html" class="btn btn-outline-glass btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Profile</a>
                </div>
                
                <div class="glass-card p-4 p-md-5">
                    <form id="settings-form">
                        <div class="mb-4">
                            <label for="inputName" class="form-label text-light fw-semibold">Full Name</label>
                            <input type="text" class="form-control bg-dark border-secondary text-light" id="inputName" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="inputEmail" class="form-label text-light fw-semibold">Email Address</label>
                            <input type="email" class="form-control bg-dark border-secondary text-light" id="inputEmail" required>
                        </div>
                        
                        <hr class="border-secondary border-opacity-25 my-4">
                        
                        <div class="mb-4">
                            <label for="inputPassword" class="form-label text-light fw-semibold">New Password <span class="text-muted fw-normal fs-6">(Optional)</span></label>
                            <input type="password" class="form-control bg-dark border-secondary text-light" id="inputPassword" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
                            <small class="text-muted mt-1 d-block">Leave blank to keep your current password.</small>
                        </div>
                        
                        <div id="save-msg" class="mb-3"></div>
                        
                        <button type="submit" class="btn btn-primary-gradient w-100 py-3 fw-bold hover-lift">
                            <i class="bi bi-save me-2"></i>Save Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 border-top border-secondary border-opacity-25 mt-auto">
        <p class="mb-0 text-muted">&copy; 2026 KnowledgeHub. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let profileData = JSON.parse(localStorage.getItem('userProfile'));
            
            if (!profileData) {
                const userStr = localStorage.getItem('knowledgehub_user');
                if (userStr) {
                    const baseUser = JSON.parse(userStr);
                    profileData = {
                        name: baseUser.username || baseUser.name || 'Learner',
                        email: baseUser.email || 'learner@example.com',
                        joined: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
                    };
                } else {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // Populate fields
            document.getElementById('inputName').value = profileData.name || '';
            document.getElementById('inputEmail').value = profileData.email || '';

            // Handle Save
            document.getElementById('settings-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const saveMsg = document.getElementById('save-msg');
                const btn = e.target.querySelector('button[type="submit"]');
                
                // Update Data
                profileData.name = document.getElementById('inputName').value;
                profileData.email = document.getElementById('inputEmail').value;
                
                localStorage.setItem('userProfile', JSON.stringify(profileData));
                
                // UI Feedback
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Saving...';
                
                setTimeout(() => {
                    saveMsg.innerHTML = '<div class="alert alert-success py-2"><i class="bi bi-check-circle-fill me-2"></i>Profile updated successfully!</div>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-save me-2"></i>Save Changes';
                    
                    setTimeout(() => {
                        saveMsg.innerHTML = '';
                    }, 3000);
                }, 800);
            });
        });
    </script>
</body>
</html>
